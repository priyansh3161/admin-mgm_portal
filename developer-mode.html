<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Developer tools shortcut detected | MGMCOET</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #0b1220; color: #e7edf7; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 440px); padding: 36px; border: 1px solid #34435b; border-radius: 20px; background: #141f31; text-align: center; box-shadow: 0 24px 70px #0007; }
    .icon { width: 58px; height: 58px; margin: 0 auto 22px; display: grid; place-items: center; border-radius: 18px; background: #40212b; color: #ff8996; font-size: 28px; }
    h1 { margin: 0 0 12px; font-size: 24px; }
    p { margin: 0; color: #b1bed2; line-height: 1.6; }
    a { display: inline-block; margin-top: 26px; padding: 12px 20px; border-radius: 10px; background: #2e5ce6; color: white; font-weight: 700; text-decoration: none; }
    a:focus-visible { outline: 3px solid #9bb5ff; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">!</div>
    <h1>Developer tools shortcut detected</h1>
    <p>You have been signed out on this device. Return to the staff sign-in page to continue.</p>
    <a href="./index.html">Return to staff sign in</a>
  </main>
  <script src="./developer-mode.js"></script>
</body>
</html>
