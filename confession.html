<!DOCTYPE html>
<html lang="en">

<head>
    <script>if (window.top !== window.self) { document.write('<style>.sidebar{display:none!important}.main-content{margin-left:0!important;width:100%!important}</style>'); }</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal | Confessions</title>
  <link rel="icon" type="image/jpeg" href="mgmcoet-mark.jpg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-base: #EEF3FD;
            --surface: #FFFFFF;
            --surface-alt: #F2F6FE;
            --ink: #0F1B33;
            --ink-soft: #536079;
            --ink-faint: #96A1BC;
            --blue: #2E5CE6;
            --blue-light: #6C93FF;
            --blue-deep: #1A38A6;
            --indigo: #6355E0;
            --indigo-light: #9088F0;
            --indigo-wash: rgba(99, 85, 224, 0.09);
            --cyan: #0DA5C0;
            --cyan-light: #4FD3E8;
            --cyan-wash: rgba(13, 165, 192, 0.09);
            --amber: #D6900F;
            --amber-wash: rgba(214, 144, 15, 0.11);
            --danger: #E14A3B;
            --danger-wash: rgba(225, 74, 59, 0.08);
            --success: #1DA35F;
            --border: rgba(15, 27, 51, 0.08);
            --shadow-sm: 0 2px 10px rgba(15, 27, 51, 0.05);
            --shadow-md: 0 14px 32px rgba(15, 27, 51, 0.08);
            --shadow-lg: 0 26px 56px rgba(20, 40, 100, 0.16);
            --sidebar-width: 272px;
            --ease: cubic-bezier(.22, 1, .36, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            overflow-x: hidden;
            max-width: 100vw;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-base);
            color: var(--ink);
            display: flex;
            height: 100vh;
            height: 100svh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Ambient mesh background */
        .mesh {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .mesh span {
            position: absolute;
            border-radius: 50%;
            filter: blur(95px);
            opacity: 0.55;
            animation: drift 24s ease-in-out infinite alternate;
        }

        .mesh span:nth-child(1) {
            width: 560px;
            height: 560px;
            top: -180px;
            right: -140px;
            background: radial-gradient(circle, rgba(46, 92, 230, 0.30), transparent 70%);
        }

        .mesh span:nth-child(2) {
            width: 460px;
            height: 460px;
            bottom: -160px;
            left: 18%;
            background: radial-gradient(circle, rgba(99, 85, 224, 0.20), transparent 70%);
            animation-delay: -8s;
        }

        .mesh span:nth-child(3) {
            width: 420px;
            height: 420px;
            top: 32%;
            right: 8%;
            background: radial-gradient(circle, rgba(13, 165, 192, 0.18), transparent 70%);
            animation-delay: -14s;
        }

        ::selection {
            background: var(--blue-light);
            color: #fff;
        }

        button:focus-visible,
        input:focus-visible,
        textarea:focus-visible {
            outline: 2px solid var(--blue-light);
            outline-offset: 3px;
            border-radius: 8px;
        }

        /* SIDEBAR */
        .sidebar {
            width: var(--sidebar-width);
            background: linear-gradient(180deg, #0A1230 0%, #101E4C 55%, #142A63 100%);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .sidebar::before {
            content: "";
            position: absolute;
            width: 320px;
            height: 320px;
            top: -110px;
            left: -110px;
            background: radial-gradient(circle, rgba(108, 147, 255, 0.25), transparent 70%);
            filter: blur(40px);
            pointer-events: none;
        }

        .sidebar>* {
            position: relative;
            z-index: 1;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
            padding: 0 6px;
        }

        .logo-mark {
            width: 42px;
            height: 42px;
            border-radius: 13px;
            background: linear-gradient(145deg, var(--blue-light), var(--blue-deep));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-family: 'Sora', sans-serif;
            font-weight: 700;
            font-size: 15px;
            box-shadow: 0 10px 22px rgba(46, 92, 230, 0.4);
            flex-shrink: 0;
        }

        .logo-text {
            font-family: 'Sora', sans-serif;
            font-weight: 700;
            font-size: 16.5px;
            color: #fff;
            line-height: 1.15;
        }

        .logo-text span {
            display: block;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.45);
            margin-top: 2px;
        }

        .nav-section-label {
            font-size: 10.5px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.32);
            text-transform: uppercase;
            margin: 32px 12px 12px;
        }

        .nav-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .nav-links li a {
            color: rgba(255, 255, 255, 0.64);
            text-decoration: none;
            font-weight: 500;
            font-size: 14.5px;
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 11px 14px;
            border-radius: 12px;
            transition: all .25s var(--ease);
        }

        .nav-links li a i {
            width: 18px;
            text-align: center;
            font-size: 15px;
        }

        .nav-links li a:hover {
            background: rgba(255, 255, 255, 0.07);
            color: #fff;
            transform: translateX(2px);
        }

        .nav-links li a.active {
            background: linear-gradient(120deg, var(--blue-light), var(--blue));
            color: #fff;
            box-shadow: 0 10px 24px rgba(46, 92, 230, 0.38);
        }

        .profile-mini {
            margin-top: auto;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .profile-mini .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(145deg, var(--cyan-light), #0DA5C0);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Sora', sans-serif;
            font-weight: 700;
            color: #fff;
        }

        .profile-mini .info strong {
            display: block;
            font-size: 13px;
            color: #fff;
        }

        .profile-mini .info span {
            font-size: 11.5px;
            color: rgba(255, 255, 255, 0.42);
            font-family: 'JetBrains Mono', monospace;
        }

        /* MAIN CONTAINER */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
        }

        /* SCROLLABLE FEED AREA */
        .feed-area {
            flex: 1;
            overflow-y: auto;
            padding: 22px 36px;
            display: flex;
            flex-direction: column;
            align-items: center;
            scrollbar-width: thin;
            scrollbar-color: rgba(15, 27, 51, 0.1) transparent;
        }

        .feed-area::-webkit-scrollbar {
            width: 6px;
        }

        .feed-area::-webkit-scrollbar-thumb {
            background: rgba(15, 27, 51, 0.15);
            border-radius: 10px;
        }

        .content-wrapper {
            width: 100%;
            max-width: 720px;
        }

        .page-header {
            margin-bottom: 20px;
            text-align: center;
            opacity: 0;
            transform: translateY(14px);
            animation: cardIn .6s var(--ease) forwards;
        }

        .eyebrow {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11.5px;
            font-weight: 600;
            color: var(--indigo);
            text-transform: uppercase;
            margin-bottom: 8px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .eyebrow .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--indigo);
            box-shadow: 0 0 0 0 rgba(99, 85, 224, 0.45);
            animation: dotPulseIndigo 2.4s infinite;
        }

        .page-header h1 {
            font-family: 'Sora', sans-serif;
            font-size: 30px;
            font-weight: 800;
        }

        .page-header p {
            font-size: 14px;
            color: var(--ink-soft);
            margin-top: 8px;
        }

        .feed-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            opacity: 0;
            transform: translateY(16px);
            animation: cardIn .6s .1s var(--ease) forwards;
        }

        .feed-header h3 {
            font-family: 'Sora', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: var(--ink);
        }

        .filter-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .filter-btn {
            background: transparent;
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: var(--ink-soft);
            cursor: pointer;
            transition: all .2s;
        }

        .filter-btn:hover {
            background: var(--surface-alt);
            color: var(--ink);
        }

        .filter-btn.active {
            background: var(--ink);
            color: #fff;
            border-color: var(--ink);
        }

        .feed-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 20px;
        }

        /* CONFESSION CARDS */
        .confession-card {
            background: var(--surface);
            border-radius: 20px;
            padding: 16px 18px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            transition: transform .3s, box-shadow .3s;
            opacity: 0;
            transform: translateY(16px);
            animation: cardIn .5s forwards;
        }

        .confession-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .c-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .c-author {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .anon-avatar {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: var(--surface-alt);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            border: 1px solid var(--border);
        }

        .c-author-info strong {
            display: block;
            font-family: 'Sora', sans-serif;
            font-size: 14.5px;
            color: var(--ink);
        }

        .c-author-info span {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--ink-faint);
            margin-top: 2px;
            display: block;
        }

        .tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            padding: 5px 10px;
            border-radius: 8px;
        }

        .tag-crush {
            background: var(--danger-wash);
            color: var(--danger);
        }

        .tag-rant {
            background: var(--amber-wash);
            color: var(--amber);
        }

        .tag-funny {
            background: var(--cyan-wash);
            color: #0088A3;
        }

        .tag-faculty {
            background: var(--indigo-wash);
            color: var(--indigo);
        }

        .c-body {
            font-size: 14px;
            color: var(--ink);
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .c-body {
            overflow-wrap: anywhere;
        }

        .confession-card {
            min-width: 0;
            max-width: 100%;
            overflow: hidden;
        }

        /* Image/video ki width = text ki width (card ka content box) */
        .c-video,
        .c-image {
            display: block;
            width: 100%;
            max-width: 100%;
            height: min(34vh, 280px);
            object-fit: contain;
            border-radius: 12px;
            margin-bottom: 10px;
            border: 1px solid var(--border);
            background: var(--surface-alt);
        }

        .c-video {
            background: #0b1020;
        }

        .c-image-open {
            display: block;
            width: 100%;
            padding: 0;
            border: 0;
            background: transparent;
            margin-bottom: 10px;
            cursor: zoom-in;
        }

        .c-image-open .c-image {
            margin: 0;
        }

        .c-image-open:focus-visible {
            outline: 3px solid var(--blue-light);
            outline-offset: 3px;
            border-radius: 12px;
        }

        .image-viewer[hidden] {
            display: none;
        }

        .image-viewer {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(5, 10, 24, .92);
            backdrop-filter: blur(8px);
        }

        .image-viewer img {
            display: block;
            max-width: min(96vw, 1500px);
            max-height: 92svh;
            object-fit: contain;
            border-radius: 10px;
            box-shadow: 0 20px 70px rgba(0, 0, 0, .45);
        }

        .image-viewer-close {
            position: absolute;
            top: max(16px, env(safe-area-inset-top));
            right: max(16px, env(safe-area-inset-right));
            width: 44px;
            height: 44px;
            border: 1px solid rgba(255, 255, 255, .3);
            border-radius: 50%;
            color: #fff;
            background: rgba(255, 255, 255, .12);
            font-size: 22px;
            cursor: pointer;
        }

        .c-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--surface-alt);
            padding-top: 10px;
        }

        .action-group {
            display: flex;
            gap: 16px;
        }

        .action-btn {
            background: transparent;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            color: var(--ink-soft);
            cursor: pointer;
            transition: color .2s;
        }

        .action-btn:hover {
            color: var(--blue);
        }

        .confession-card.shared-post-focus {
            outline: 2px solid var(--blue);
            box-shadow: 0 0 0 5px color-mix(in srgb, var(--blue) 16%, transparent);
        }

        .action-btn.upvoted {
            color: var(--indigo);
        }

        .report-btn {
            color: var(--ink-faint);
            background: transparent;
            border: none;
            cursor: pointer;
            transition: color .2s;
        }

        .report-btn:hover {
            color: var(--danger);
        }

        .action-btn.liked,
        .action-btn.liked i {
            color: var(--danger);
        }

        .delete-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--ink-faint);
            background: transparent;
            border: none;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: color .2s, background .2s;
        }

        .delete-btn:hover {
            color: var(--danger);
            background: var(--danger-wash);
        }

        /* COMMENTS SECTION */
        .comments-section {
            margin-top: 16px;
            border-top: 1px dashed var(--border);
            padding-top: 16px;
            display: none;
        }

        .comments-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
            max-height: 200px;
            overflow-y: auto;
        }

        .comment-item {
            background: var(--surface-alt);
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 13px;
            color: var(--ink);
            line-height: 1.4;
        }

        .comment-item strong {
            font-weight: 600;
            margin-right: 6px;
        }
        .comment-delete-btn { display: block; margin: 8px 0 0 auto; border: 0; padding: 3px 6px; color: #b42318; background: transparent; font: 700 12px 'Inter', sans-serif; cursor: pointer; }
        .comment-delete-btn:hover { color: var(--danger); background: var(--danger-wash); border-radius: 5px; }

        .comment-input-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .comment-input-row input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            outline: none;
            transition: border-color .2s;
        }

        .comment-input-row input:focus {
            border-color: var(--indigo-light);
        }

        .btn-send-comment {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: var(--indigo-wash);
            color: var(--indigo);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .2s;
        }

        .btn-send-comment:hover {
            background: var(--indigo);
            color: #fff;
        }

        /* ========================================================
       FIXED BOTTOM SUBMIT BAR - FULL WIDTH DOCK STYLE
       ======================================================== */
        .fixed-bottom-bar {
            background: rgba(255, 255, 255, 0.85);
            /* Solid glass background across entire width */
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-top: 1px solid var(--border);
            box-shadow: 0 -4px 30px rgba(15, 27, 51, 0.04);
            padding: 24px 46px;
            /* Padding matches the main content padding */
            display: flex;
            justify-content: center;
            z-index: 20;
            width: 100%;
        }

        .submit-box {
            width: 100%;
            max-width: 100%;
            /* Allows it to take full available space */
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Image Preview Container */
        .image-preview-box {
            display: none;
            position: relative;
            width: fit-content;
            margin-bottom: 2px;
        }

        .image-preview-box img {
            max-height: 80px;
            border-radius: 10px;
            border: 2px solid var(--indigo-light);
            object-fit: contain;
        }

        .remove-image-btn {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 22px;
            height: 22px;
            background: var(--danger);
            color: #fff;
            border: none;
            border-radius: 50%;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-sm);
            z-index: 2;
        }

        /* Input Area - Full Width & Modern */
        .confession-textarea {
            width: 100%;
            padding: 16px 20px;
            border-radius: 16px;
            border: 2px solid transparent;
            background: linear-gradient(var(--surface-alt), var(--surface-alt)) padding-box,
                linear-gradient(135deg, var(--indigo-light), var(--cyan-light)) border-box;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            color: var(--ink);
            resize: none;
            min-height: 60px;
            max-height: min(38vh, 240px);
            transition: border-color .3s var(--ease), background .3s var(--ease), box-shadow .3s var(--ease);
            outline: none;
            line-height: 1.55;
            overflow-y: auto;
            overscroll-behavior: contain;
            scrollbar-width: thin;
            scrollbar-color: var(--indigo-light) transparent;
            box-shadow: 0 4px 10px rgba(99, 85, 224, 0.04);
        }

        .confession-textarea::-webkit-scrollbar {
            width: 6px;
        }

        .confession-textarea::-webkit-scrollbar-track {
            background: transparent;
            margin: 10px 0;
        }

        .confession-textarea::-webkit-scrollbar-thumb {
            background: var(--indigo-light);
            border-radius: 999px;
        }

        .textarea-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: -4px;
            padding: 0 6px;
            font-size: 11.5px;
            font-weight: 500;
            color: var(--ink-faint);
            min-height: 14px;
        }

        .textarea-meta .hint {
            opacity: 0;
            transition: opacity .2s;
        }

        .confession-textarea:focus~.textarea-meta .hint {
            opacity: 1;
        }

        .textarea-meta .count {
            font-variant-numeric: tabular-nums;
            margin-left: auto;
        }

        @media (max-width: 900px) {
            .textarea-meta .hint {
                display: none;
            }
        }

        .confession-textarea:focus {
            background: linear-gradient(var(--surface), var(--surface)) padding-box,
                linear-gradient(135deg, var(--indigo), var(--cyan)) border-box;
            box-shadow: 0 6px 20px rgba(13, 165, 192, 0.12), 0 0 0 3px var(--cyan-wash);
        }

        .confession-textarea::placeholder {
            color: var(--ink-faint);
            font-weight: 500;
        }

        .submit-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2px;
        }

        .controls-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .attach-btn {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: var(--surface-alt);
            border: 1px solid var(--border);
            color: var(--indigo);
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .2s;
        }

        .attach-btn:hover {
            background: var(--indigo-wash);
            border-color: var(--indigo-light);
            transform: translateY(-2px);
        }

        .category-select {
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--surface-alt);
            font-family: 'Inter', sans-serif;
            font-size: 13.5px;
            font-weight: 600;

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        /*
         SETUP REQUIRED:
         1) Replace SUPABASE_URL and SUPABASE_ANON_KEY below with your project's public values.
         2) Deploy the authenticated cloudinary-signature Supabase Edge Function.
         3) Run confession_schema.sql in Supabase SQL Editor.
         Never put a Supabase service_role key in browser code.
        */
        const SUPABASE_URL = "https://ixaxvcinbbbqriylqcvi.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml4YXh2Y2luYmJicXJpeWxxY3ZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4MTI1OTgsImV4cCI6MjEwNzM4ODU5OH0._u3etS_EvChQfFYF3YIeXriB2AM1h7sxCw28FDjZTas";
        const CLOUDINARY_CLOUD_NAME = "jgkwrktm";

        const supabaseReady = !!(window.supabase && SUPABASE_URL.startsWith("https://") &&
            SUPABASE_ANON_KEY !== "YOUR_SUPABASE_ANON_KEY");
        const sb = supabaseReady
            ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                auth: {
                    storageKey: 'mgm-portal-auth',   // supabase-config.js wali key (login yahi use karta hai)
                    persistSession: true,
                    autoRefreshToken: true
                }
            })
            : null;
        const avatars = ["🕵️", "👻", "👽", "🤖", "🐱", "🎭", "🦊", "🌙"];
        let selectedFile = null;
        let currentUser = null;
        let myPostIds = new Set();
        let myCommentIds = new Set();
        let myCommentIdsLoaded = false;
        let myLikes = new Set();
        const voteInteractionIds = new Set();
        let feedLoadVersion = 0;
        let currentFilter = "latest";
        let currentView = "feed";
        const categoryLabels = {
            "tag-crush": "Crush", "tag-rant": "Rant", "tag-funny": "Funny", "tag-faculty": "Faculty"
        };
        const escapeHTML = (v) => String(v ?? "").replace(/[&<>"']/g, c => ({
            "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        }[c]));
        function safeConfessionMediaUrl(value) {
            try {
                const url = new URL(String(value || ''));
                return url.protocol === 'https:' && url.hostname === 'res.cloudinary.com' &&
                    url.pathname.startsWith(`/${CLOUDINARY_CLOUD_NAME}/`) && !url.username && !url.password
                    ? url.href : '';
            } catch { return ''; }
        }
        const randomAvatar = () => avatars[Math.floor(Math.random() * avatars.length)];

        function autoResize(el) {
            el.style.height = "auto";
            const max = parseFloat(getComputedStyle(el).maxHeight) || 240;
            const needed = el.scrollHeight;
            el.style.height = Math.min(needed, max) + "px";
            el.style.overflowY = needed > max ? "auto" : "hidden";
            const counter = document.getElementById("charCount");
            if (counter) {
                const n = el.value.length;
                counter.textContent = n ? n.toLocaleString() + " characters" : "";
            }
        }
        function previewImage(event) {
            const file = event.target.files?.[0];
            if (!file) return;
            if (!/^image\/|^video\//.test(file.type)) { portalToast("Please select an image or video.", 'error'); event.target.value = ""; return; }
            if (file.size > 50 * 1024 * 1024) { portalToast("Media must be 50 MB or smaller.", 'error'); event.target.value = ""; return; }
            selectedFile = file;
            const box = document.getElementById("imagePreviewBox");
            const img = document.getElementById("imagePreview");
            const video = document.getElementById("videoPreview");
            const localUrl = URL.createObjectURL(file);
            box.style.display = "block";
            if (file.type.startsWith("video/")) {
                img.style.display = "none"; video.style.display = "block"; video.src = localUrl;
            } else {
                video.pause(); video.removeAttribute("src"); video.style.display = "none";
                img.style.display = "block"; img.src = localUrl;
            }
        }
        function clearImage() {
            selectedFile = null;
            document.getElementById("fileUpload").value = "";
            document.getElementById("imagePreviewBox").style.display = "none";
            document.getElementById("imagePreview").removeAttribute("src");
            const video = document.getElementById("videoPreview");
            video.pause(); video.removeAttribute("src"); video.style.display = "none";
        }
        async function uploadMedia(file) {
            if (!file) return null;
            const { getCloudinaryUploadSignature, uploadSignedCloudinaryFile } = await import("./cloudinary-upload.js");
            const purposeType = file.type.startsWith("video/") ? "video" : "image";
            const signature = await getCloudinaryUploadSignature(sb, { purpose: "confession_media", resource_type: purposeType });
            const data = await uploadSignedCloudinaryFile(signature, file);
            return { url: data.secure_url, type: file.type.startsWith("video/") ? "video" : "image" };
        }
        function showStatus(message, isError = false) {
            const feed = document.getElementById("confessionFeed");
            feed.innerHTML = `<div class="confession-card" style="opacity:1;transform:none"><div class="c-body" style="${isError ? 'color:var(--danger)' : ''}">${escapeHTML(message)}</div></div>`;
        }
        function idFromRpcRow(row) {
            if (typeof row !== "object" || row === null) return String(row);
            return String(row.id ?? row.post_id ?? row.comment_id ?? Object.values(row)[0] ?? "");
        }
        async function loadMyPostIds() {
            myPostIds = new Set();
            if (!currentUser) return;
            const { data: mine, error } = await sb.rpc("my_confession_ids");
            if (error) throw error;
            myPostIds = new Set((mine || []).map(idFromRpcRow).filter(Boolean));
        }
        async function loadMyCommentIds() {
            myCommentIds = new Set();
            if (!currentUser) return;
            const { data: mine, error } = await sb.rpc("my_confession_comment_ids");
            if (error) throw error;
            myCommentIds = new Set((mine || []).map(idFromRpcRow).filter(Boolean));
            myCommentIdsLoaded = true;
        }
        async function loadFeed() {
            if (!sb) {
                showStatus("Connect Supabase to load live confessions. Add your project URL and anon key in this file, then run confession_schema.sql.");
                return;
            }
            const { data: { session }, error: authError } = await sb.auth.getSession();
            currentUser = session?.user || null;
            if (authError) console.warn(authError);
            if (!currentUser) {
                const loginUrl = new URL('login.html', location.href);
                loginUrl.searchParams.set('returnTo', location.href);
                try { window.top.location.replace(loginUrl.href); }
                catch { location.replace(loginUrl.href); }
                return;
            }
            const feedVersion = ++feedLoadVersion;
            // Apni posts ki ids (delete button sirf inhi par dikhega). Anonymity bani rehti hai:
            // server sirf ids deta hai, kisi aur ko author pata nahi chalta.
            let myPostIdsError = null;
            const myPostIdsPromise = loadMyPostIds().catch(error => {
                myPostIdsError = error;
                console.warn("my_confession_ids:", error.message);
            });
            const votesPromise = Promise.resolve(sb.from("confession_votes").select("post_id"))
                .catch(error => ({ data: null, error }));

            // Public feed stays capped at 100; My Posts fetches every authored ID in
            // small batches so older posts remain reachable even after the feed grows.
            let data = [];
            let error = null;
            const columns = "id,body,tag,avatar_emoji,created_at,upvote_count,comment_count,media_url,media_type";
            const sharedPostId = new URLSearchParams(location.search).get("post");
            if (sharedPostId) {
                document.getElementById("feedHeading").textContent = "Shared Confession";
                const result = await sb.from("public_confessions").select(columns).eq("id", sharedPostId).maybeSingle();
                error = result.error;
                if (result.data) data = [result.data];
                else if (!error) {
                    const shared = await sb.rpc("get_shared_confession", { p_post_id: sharedPostId });
                    error = shared.error;
                    data = (shared.data || []).map(post => ({ ...post, _pending: true }));
                }
            } else if (currentView === "mine") {
                await myPostIdsPromise;
                if (!currentUser) {
                    document.getElementById("feedHeading").textContent = "My Posts";
                    showStatus("Sign in to view and delete your anonymous posts.");
                    return;
                }
                if (myPostIdsError) {
                    document.getElementById("feedHeading").textContent = "My Posts";
                    showStatus("Could not load your posts: " + myPostIdsError.message, true);
                    return;
                }
                const ids = [...myPostIds];
                if (!ids.length) {
                    document.getElementById("feedHeading").textContent = "My Posts";
                    showStatus("You haven't posted any confessions yet.");
                    return;
                }
                const batches = [];
                for (let i = 0; i < ids.length; i += 100) batches.push(ids.slice(i, i + 100));
                const results = await Promise.all(batches.map(idsBatch => sb.from("public_confessions")
                    .select(columns).in("id", idsBatch).order("created_at", { ascending: false })));
                error = results.find(result => result.error)?.error || null;
                data = results.flatMap(result => result.data || []);
                const approvedIds = new Set(data.map(post => String(post.id)));
                const pendingIds = ids.filter(id => !approvedIds.has(String(id)));
                for (let i = 0; i < pendingIds.length; i += 20) {
                    const pendingBatch = await Promise.all(pendingIds.slice(i, i + 20).map(id =>
                        sb.rpc("get_shared_confession", { p_post_id: id })));
                    error = error || pendingBatch.find(result => result.error)?.error || null;
                    data.push(...pendingBatch.flatMap(result => (result.data || []).map(post => ({ ...post, _pending: true }))));
                }
                data.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
                document.getElementById("feedHeading").textContent = "My Posts";
            } else {
                document.getElementById("feedHeading").textContent = "Recent Confessions";
                let query = sb.from("public_confessions").select(columns);
                query = currentFilter === "top" ? query.order("upvote_count", { ascending: false }) : query.order("created_at", { ascending: false });
                const result = await query.limit(100);
                data = result.data || [];
                error = result.error;
            }
            if (error) {
                showStatus("Could not load confessions: " + error.message, true);
                return;
            }
            await myPostIdsPromise;
            const feed = document.getElementById("confessionFeed");
            feed.innerHTML = "";
            if (!data?.length) {
                showStatus(sharedPostId ? "This confession is unavailable or was deleted." : currentView === "mine" ? "No visible posts here. Your deleted or moderator-hidden posts won't appear." : "No confessions yet. Be the first to share something anonymously!");
                return;
            }
            data.forEach((post, i) => feed.appendChild(renderPost(post, i)));
            if (currentUser) {
                // Let posts render while the vote-state request finishes.
                void votesPromise.then(({ data: votes, error: voteErr }) => {
                    if (feedVersion !== feedLoadVersion) return;
                    if (voteErr) { console.warn("confession_votes:", voteErr.message); return; }
                    myLikes = new Set((votes || []).map(v => String(v.post_id)));
                    feed.querySelectorAll('[data-action="vote"]').forEach(button => {
                        const postCard = button.closest('[data-post-id]');
                        const postId = String(postCard?.dataset.postId || '');
                        if (!postId || voteInteractionIds.has(postId)) return;
                        setLiked(button, myLikes.has(postId), Number(button.querySelector('.count')?.textContent) || 0);
                    });
                }).catch(error => console.warn("confession_votes:", error?.message || error));
            }
            if (sharedPostId) {
                const card = feed.querySelector(`[data-post-id="${CSS.escape(sharedPostId)}"]`);
                if (card) {
                    card.classList.add("shared-post-focus");
                    card.scrollIntoView({ behavior: "smooth", block: "center" });
                }
            }
        }
        async function sharePost(postId) {
            const link = new URL("index.html", location.href);
            link.searchParams.set("post", postId);
            link.hash = "confession";
            try {
                if (navigator.share) await navigator.share({ title: "Anonymous confession", url: link.href });
                else if (navigator.clipboard?.writeText) {
                    await navigator.clipboard.writeText(link.href);
                    window.alert("Post link copied.");
                } else window.prompt("Copy this confession link", link.href);
            } catch (error) {
                if (error.name !== "AbortError") window.prompt("Copy this confession link", link.href);
            }
        }
        function timeAgo(value) {
            const seconds = Math.max(0, Math.floor((Date.now() - new Date(value).getTime()) / 1000));
            if (seconds < 60) return "Just now";
            if (seconds < 3600) return `${Math.floor(seconds / 60)} min ago`;
            if (seconds < 86400) return `${Math.floor(seconds / 3600)} hours ago`;
            return `${Math.floor(seconds / 86400)} days ago`;
        }
        function renderPost(post, i = 0) {
            const card = document.createElement("div");
            card.className = "confession-card";
            card.style.animationDelay = `${Math.min(i, 8) * .04}s`;
            const tag = categoryLabels[post.tag] ? post.tag : "tag-funny";
            const isMine = myPostIds.has(String(post.id));
            const canInteract = !post._pending;
            const mediaUrl = safeConfessionMediaUrl(post.media_url);
            const media = mediaUrl ? (post.media_type === "video"
                ? `<video class="c-video" src="${escapeHTML(mediaUrl)}" controls preload="metadata"></video>`
                : `<button class="c-image-open" type="button" data-view-image aria-label="Open image full size"><img class="c-image" src="${escapeHTML(mediaUrl)}" alt="Anonymous attachment" loading="lazy"></button>`) : "";
            card.innerHTML = `
    <div class="c-header"><div class="c-author"><div class="anon-avatar">${escapeHTML(post.avatar_emoji || "🎭")}</div>
      <div class="c-author-info"><strong>Anonymous</strong><span>${escapeHTML(timeAgo(post.created_at))}</span></div></div>
      <span class="tag ${tag}">${categoryLabels[tag]}</span></div>
    ${post.body ? `<div class="c-body">${escapeHTML(post.body).replace(/\n/g, "<br>")}</div>` : ""}${media}
    <div class="c-footer"><div class="action-group">
      ${canInteract ? `<button class="action-btn${myLikes.has(String(post.id)) ? " liked" : ""}" data-action="vote"><i class="${myLikes.has(String(post.id)) ? "fas" : "far"} fa-heart"></i> <span class="count">${Number(post.upvote_count) || 0}</span></button>
      <button class="action-btn" data-action="comments"><i class="far fa-comment"></i> <span class="c-count">${Number(post.comment_count) || 0}</span></button>` : ""}
      <button class="action-btn" data-action="share" title="Share post" aria-label="Share post"><i class="fas fa-share-alt"></i></button>
    </div>${isMine
                    ? `<button class="delete-btn" data-action="delete" title="Delete my post" aria-label="Delete my post"><i class="fas fa-trash"></i> Delete</button>`
                    : `<button class="report-btn" data-action="report" title="Report this post" aria-label="Report this post"><i class="fas fa-flag"></i></button>`}</div>
    ${canInteract ? `<div class="comments-section"><div class="comments-list"></div><div class="comment-input-row">
      <input type="text" placeholder="Add an anonymous comment..." class="comment-input" maxlength="1000">
      <button class="btn-send-comment" data-action="send-comment" aria-label="Send comment"><i class="fas fa-paper-plane"></i></button>
    </div></div>` : ""}`;
            card.dataset.postId = post.id;
            card.querySelector('[data-action="vote"]')?.addEventListener("click", () => toggleUpvote(card, post.id));
            card.querySelector('[data-action="comments"]')?.addEventListener("click", () => toggleComments(card, post.id));
            card.querySelector('[data-action="share"]').addEventListener("click", () => sharePost(post.id));
            card.querySelector('[data-view-image]')?.addEventListener("click", event => openImageViewer(mediaUrl, event.currentTarget.querySelector("img")?.alt || "Confession attachment", event.currentTarget));
            card.querySelector('[data-action="report"]')?.addEventListener("click", () => reportPost(post.id));
            card.querySelector('[data-action="delete"]')?.addEventListener("click", () => deletePost(card, post.id));
            card.querySelector('[data-action="send-comment"]')?.addEventListener("click", () => postComment(card, post.id));
            card.querySelector(".comment-input")?.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); postComment(card, post.id); } });
            return card;
        }
        let imageViewerTrigger = null;
        function openImageViewer(src, alt, trigger) {
            const viewer = document.getElementById("imageViewer");
            const image = document.getElementById("imageViewerImage");
            imageViewerTrigger = trigger;
            image.src = src;
            image.alt = alt;
            viewer.hidden = false;
            document.getElementById("imageViewerClose").focus();
        }
        function closeImageViewer() {
            const viewer = document.getElementById("imageViewer");
            if (viewer.hidden) return;
            viewer.hidden = true;
            document.getElementById("imageViewerImage").removeAttribute("src");
            imageViewerTrigger?.focus();
            imageViewerTrigger = null;
        }
        document.getElementById("imageViewerClose").addEventListener("click", closeImageViewer);
        document.getElementById("imageViewer").addEventListener("click", event => {
            if (event.target.id === "imageViewer") closeImageViewer();
        });
        document.addEventListener("keydown", event => {
            if (event.key === "Escape") closeImageViewer();
        });
        function setLiked(btn, liked, count) {
            btn.classList.toggle("liked", liked);
            const icon = btn.querySelector("i");
            icon.classList.toggle("fas", liked);
            icon.classList.toggle("far", !liked);
            btn.querySelector(".count").textContent = count;
        }
        // Poore feed ko rebuild kiye bina sirf is post ke counts server se sync karo
        async function refreshCounts(card, postId) {
            const { data, error } = await sb.from("public_confessions")
                .select("upvote_count,comment_count").eq("id", postId).maybeSingle();
            if (error || !data) return;
            const upvoteCount = card.querySelector(".count");
            const commentCount = card.querySelector(".c-count");
            if (upvoteCount) upvoteCount.textContent = Number(data.upvote_count) || 0;
            if (commentCount) commentCount.textContent = Number(data.comment_count) || 0;
        }
        async function toggleUpvote(card, postId) {
            if (!sb) return portalToast("Configure Supabase first.", 'error');
            if (!currentUser) return portalToast("Please sign in to vote.", 'error');
            const btn = card.querySelector('[data-action="vote"]');
            const wasLiked = btn.classList.contains("liked");
            voteInteractionIds.add(String(postId));
            const before = Number(btn.querySelector(".count").textContent) || 0;
            setLiked(btn, !wasLiked, Math.max(0, before + (wasLiked ? -1 : 1)));   // turant dikhao
            btn.disabled = true;
            const { error } = await sb.rpc("toggle_confession_vote", { p_post_id: postId });
            btn.disabled = false;
            if (error) {
                setLiked(btn, wasLiked, before);                                   // fail hua to wapas
                return portalToast("Could not save vote: " + error.message, 'error');
            }
            wasLiked ? myLikes.delete(String(postId)) : myLikes.add(String(postId));
            await refreshCounts(card, postId);
        }
        function toggleComments(card, postId) {
            const section = card.querySelector(".comments-section");
            const opening = getComputedStyle(section).display === "none";
            section.style.display = opening ? "block" : "none";
            if (opening) { loadComments(card, postId); card.querySelector(".comment-input").focus(); }
        }
        async function loadComments(card, postId) {
            const list = card.querySelector(".comments-list");
            list.innerHTML = '<div class="comment-item">Loading comments…</div>';
            const commentsPromise = sb.from("public_confession_comments")
                .select("id,body,avatar_emoji,created_at").eq("post_id", postId).order("created_at", { ascending: true });
            let commentsResult;
            if (!myCommentIdsLoaded && currentUser) {
                [commentsResult] = await Promise.all([commentsPromise, loadMyCommentIds().catch(error => {
                    console.warn("my_confession_comment_ids:", error.message);
                })]);
            } else commentsResult = await commentsPromise;
            const { data, error } = commentsResult;
            if (error) { list.innerHTML = `<div class="comment-item">${escapeHTML(error.message)}</div>`; return; }
            list.innerHTML = "";
            // Match the post-level owner control. The Edge Function also
            // verifies ownership before deleting any comment.
            const ownsPost = Boolean(card.querySelector('[data-action="delete"]'));
            (data || []).forEach(comment => {
                const item = document.createElement("div"); item.className = "comment-item";
                item.dataset.commentId = String(comment.id);
                item.innerHTML = `<strong>${escapeHTML(comment.avatar_emoji || "👻")} Anon:</strong> ${escapeHTML(comment.body)}`;
                if (ownsPost || myCommentIds.has(String(comment.id))) {
                    const button = document.createElement("button"); button.className = "comment-delete-btn";
                    button.type = "button"; button.title = "Delete comment"; button.setAttribute("aria-label", "Delete comment");
                    button.innerHTML = '<i class="fas fa-trash"></i> Delete';
                    button.addEventListener("click", () => deleteComment(card, postId, comment.id));
                    item.appendChild(button);
                }
                list.appendChild(item);
            });
        }
        async function deleteComment(card, postId, commentId) {
            if (!sb || !currentUser) return portalToast("Please sign in first.", 'error');
            if (!await portalConfirm("Delete this comment from your confession?", { danger: true, confirmText: 'Delete comment' })) return;
            const commentItem = card.querySelector(`[data-comment-id="${CSS.escape(String(commentId))}"]`);
            const list = commentItem?.parentElement;
            const nextItem = commentItem?.nextSibling;
            const count = card.querySelector(".c-count");
            commentItem?.remove();
            if (count && commentItem) count.textContent = Math.max(0, (Number(count.textContent) || 0) - 1);
            try {
                const { data, error } = await sb.functions.invoke("admin-moderation", {
                    body: { action: "delete_confession_comment", comment_id: String(commentId) }
                });
                if (error || data?.error) throw Object.assign(new Error(data?.error || error?.message || "Unknown error"), { context: error?.context });
                myCommentIds.delete(String(commentId));
                portalToast("Comment deleted.");
            } catch (error) {
                let detail = error?.message || "Unknown error";
                try {
                    const response = error?.context;
                    const payload = response?.clone ? await response.clone().json() : null;
                    if (payload?.error) detail = payload.error;
                } catch (_) {}
                if (commentItem && list?.isConnected) list.insertBefore(commentItem, nextItem?.parentNode === list ? nextItem : null);
                if (count && commentItem) count.textContent = (Number(count.textContent) || 0) + 1;
                console.error("Could not delete confession comment:", detail, error);
                portalToast("Could not delete comment: " + detail, 'error');
            }
        }
        async function postComment(card, postId) {
            const input = card.querySelector(".comment-input");
            const body = input.value.trim();
            if (!body) return;
            if (!sb || !currentUser) return portalToast("Please sign in to comment.", 'error');
            const btn = card.querySelector('[data-action="send-comment"]'); btn.disabled = true;
            const { error } = await sb.from("confession_comments").insert({ post_id: postId, body, avatar_emoji: randomAvatar() });
            btn.disabled = false;
            if (error) return portalToast("Could not post comment: " + error.message, 'error');
            input.value = "";
            const cc = card.querySelector(".c-count");
            cc.textContent = (Number(cc.textContent) || 0) + 1;                    // turant dikhao
            await Promise.all([loadComments(card, postId), refreshCounts(card, postId)]);
        }
        async function reportPost(postId) {
            if (!sb || !currentUser) return portalToast("Please sign in to report a post.", 'error');
            if (!await portalConfirm("Report this confession to the moderators? Reports are reviewed anonymously.", { confirmText: 'Report post' })) return;
            const { error } = await sb.rpc("report_confession", { p_post_id: postId });
            if (error) return portalToast("Could not submit report: " + error.message, 'error');
            portalToast("Report submitted.");
            await loadFeed();
        }
        async function deletePost(card, postId) {
            if (!sb || !currentUser) return portalToast("Please sign in first.", 'error');
            if (!await portalConfirm("This post will be permanently deleted. Continue?", { danger: true, confirmText: 'Delete post' })) return;
            const parent = card.parentElement;
            const nextCard = card.nextSibling;
            card.remove();
            try {
                const { data, error } = await sb.functions.invoke("admin-moderation", {
                    body: { action: "delete_my_confession", post_id: String(postId) }
                });
                if (error || data?.error) throw new Error(data?.error || error?.message || "Unknown error");
                myPostIds.delete(String(postId));
                if (parent && !parent.querySelector('.confession-card')) {
                    showStatus(currentView === "mine" ? "No visible posts here." : "No confessions yet.");
                }
                portalToast("Post deleted.");
            } catch (error) {
                if (parent?.isConnected) parent.insertBefore(card, nextCard?.parentNode === parent ? nextCard : null);
                portalToast("Could not delete: " + (error?.message || "Unknown error"), 'error');
            }
        }
        let isPosting = false;
        async function postConfession() {
            if (isPosting) return;
            if (!sb) return portalToast("Configure Supabase first (project URL and anon key).", 'error');
            if (!currentUser) return portalToast("Please sign in before posting.", 'error');
            const input = document.getElementById("confessionInput");
            const body = input.value.trim();
            if (!body && !selectedFile) return portalToast("Please write something or attach an image/video.", 'error');
            const submit = document.querySelector(".btn-submit");
            isPosting = true;
            submit.disabled = true;
            try {
                const media = await uploadMedia(selectedFile);
                const tag = document.getElementById("confessionCategory").value;
                const { error } = await sb.from("confessions").insert({
                    body, tag, avatar_emoji: randomAvatar(),
                    media_url: media?.url || null, media_type: media?.type || null
                });
                if (error) throw error;
                input.value = ""; autoResize(input); clearImage();
                currentView = "mine";
                document.querySelectorAll(".filter-btn").forEach(btn => btn.classList.toggle("active", btn.dataset.view === "mine"));
                document.getElementById("feedArea").scrollTo({ top: 0, behavior: "smooth" });
                await loadFeed();
            } catch (e) { portalToast("Post failed: " + (e.message || "Unknown error"), 'error'); }
            finally { isPosting = false; submit.disabled = false; }
        }
        document.querySelectorAll(".filter-btn").forEach(btn => btn.addEventListener("click", async () => {
            document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            currentView = btn.dataset.view || "feed";
            if (btn.dataset.filter) currentFilter = btn.dataset.filter;
            await loadFeed();
        }));
        const confessionInput = document.getElementById("confessionInput");
        confessionInput.addEventListener("input", e => autoResize(e.target));
        confessionInput.addEventListener("keydown", e => {
            if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); postConfession(); }
        });
        autoResize(confessionInput);
        document.getElementById("fileUpload").addEventListener("change", previewImage);
        document.querySelector(".remove-image-btn").addEventListener("click", clearImage);
        document.querySelector(".attach-btn").addEventListener("click", () => document.getElementById("fileUpload").click());
        document.querySelector(".btn-submit").addEventListener("click", postConfession);
        if (sb) {
            sb.auth.onAuthStateChange((_event, session) => { currentUser = session?.user || null; });
        }
        loadFeed();
    </script>

</body>
