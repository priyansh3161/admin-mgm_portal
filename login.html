      -webkit-mask-image: linear-gradient(180deg, #000 80%, transparent 100%);
      mask-image: linear-gradient(180deg, #000 80%, transparent 100%);
    }

    /* soft shade behind the text only */
    .bg-wrap::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(0deg, rgba(10, 6, 2, .55) 0%, rgba(10, 6, 2, 0) 45%),
        linear-gradient(180deg, rgba(10, 20, 30, .30) 0%, rgba(10, 20, 30, 0) 14%);
    }

    /* ---------- Brand, top-left, no box ---------- */
    .brand {
      position: fixed;
      top: 28px;
      left: clamp(28px, 4vw, 64px);
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #fff;
      text-shadow: 0 2px 12px rgba(0, 0, 0, .45);
    }

    .brand .mark {
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      object-fit: cover;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 4px 14px rgba(0, 0, 0, .28);
    }

    .brand .name {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-weight: 800;
      font-size: 17px;
      letter-spacing: .04em;
      line-height: 1.1;
    }

    .brand .sub { font-size: 12px; font-weight: 500; opacity: .9; }

    /* ---------- Headline sits straight on the photo ---------- */
    .hero {
      position: fixed;
      z-index: 2;
      left: clamp(28px, 4vw, 64px);
      bottom: clamp(32px, 7vh, 72px);
      width: calc(100vw - var(--panel-w) - clamp(28px, 4vw, 64px) * 2);
      max-width: 640px;
      text-shadow: 0 2px 24px rgba(0, 0, 0, .5);
    }

    .hero h2 {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: clamp(38px, 5vw, 76px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -.03em;
      color: #fff;
    }

    .hero p {
      margin-top: 16px;
      max-width: 42ch;
      font-size: clamp(15px, 1.3vw, 18px);
      line-height: 1.6;
      color: rgba(255, 255, 255, .92);
    }

    .hero .feats {
      display: flex;
      gap: 26px;
      margin-top: 22px;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
    }

    .hero .feats span {
      padding-left: 12px;
      border-left: 3px solid var(--saffron);
    }

    /* ---------- Floating sign-in panel ---------- */
    .panel {
      position: fixed;
      z-index: 4;
      top: 50%;
      right: clamp(10px, 1.8vw, 28px);
      bottom: auto;
      width: var(--panel-w);
      max-width: calc(100vw - 56px);
      max-height: calc(100dvh - 56px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 36px 34px 30px;
      overflow-y: auto;
      background: linear-gradient(145deg, rgba(67, 28, 17, .91), rgba(37, 17, 11, .94));
      backdrop-filter: blur(18px) saturate(125%);
      -webkit-backdrop-filter: blur(18px) saturate(125%);
      border: 1px solid rgba(255, 220, 190, .26);
      border-left: 3px solid var(--saffron);
      border-radius: 18px;
      box-shadow: 0 26px 76px rgba(10, 10, 4, .38), inset 0 1px 0 rgba(255, 243, 230, .08);
      translate: 0 -50%;
      animation: slideIn .7s cubic-bezier(.2, .8, .2, 1) both;
    }

    h1 {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -.02em;
      color: #fff;
    }

    .panel .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      color: var(--saffron);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .panel .eyebrow::before {
      content: "";
      width: 20px;
      height: 2px;
      background: currentColor;
    }

    .tagline {
      margin: 8px 0 32px;
      font-size: 14.5px;
      line-height: 1.55;
      color: var(--cream-dim);
    }

    /* underline fields, no boxes */
    .field { margin-bottom: 24px; }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--cream-dim);
      margin-bottom: 4px;
    }

    .input-wrap { position: relative; display: flex; align-items: center; }

    .input-wrap input {
      width: 100%;
      padding: 10px 40px 10px 0;
      background: transparent;
      border: 0;
      border-bottom: 1.5px solid var(--line);
      border-radius: 0;
      color: #fff;
      font: 500 16.5px 'Figtree', sans-serif;
      outline: none;
      transition: border-color .2s ease;
    }

    .input-wrap input::placeholder { color: rgba(255, 243, 230, .42); font-weight: 400; }
    .input-wrap input:focus { border-bottom-color: var(--saffron); }

    .input-wrap input:-webkit-autofill {
      -webkit-text-fill-color: #fff;
      -webkit-box-shadow: 0 0 0 40px #4a1a10 inset;
      caret-color: #fff;
    }

    .toggle-eye {
      position: absolute;
      right: 0;
      display: flex;
      padding: 8px;
      border: 0;
      background: none;
      border-radius: 6px;
      color: var(--cream-dim);
      cursor: pointer;
    }

    .toggle-eye:hover { color: var(--saffron); }
    .toggle-eye:focus-visible { outline: 2px solid var(--saffron); }
    .toggle-eye svg { width: 20px; height: 20px; }
    .toggle-eye .off { display: none; }
    .toggle-eye.showing .on { display: none; }
    .toggle-eye.showing .off { display: block; }

    .options-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: -4px 0 26px;
      font-size: 13.5px;
    }

    .checkbox-wrap { display: flex; align-items: center; gap: 8px; color: var(--cream-dim); cursor: pointer; }
    .checkbox-wrap input { accent-color: var(--saffron); width: 16px; height: 16px; cursor: pointer; }

    .forgot-link { color: var(--saffron); font-weight: 600; text-decoration: none; }
    .forgot-link:hover { text-decoration: underline; }

    .btn-primary {
      width: 100%;
      min-height: 52px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(180deg, var(--saffron), var(--saffron-deep));
      color: #2a0e07;
      font: 800 16px 'Bricolage Grotesque', sans-serif;
      letter-spacing: .01em;
      cursor: pointer;
      box-shadow: 0 10px 26px rgba(226, 132, 26, .32);
      transition: transform .15s ease, filter .15s ease;
    }

    .btn-primary:hover { transform: translateY(-1px); filter: brightness(1.07); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: .6; cursor: not-allowed; transform: none; }
    .btn-primary:focus-visible, .btn-google:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

    .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 22px 0;
      font-size: 13px;
      color: var(--cream-dim);
    }

    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

    .btn-google {
      width: 100%;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 12px 16px;
      border: 1.5px solid var(--line);
      border-radius: 10px;
      background: rgba(255, 255, 255, .06);
      color: #fff;
      font: 600 15px 'Figtree', sans-serif;
      cursor: pointer;
      transition: background .15s ease, border-color .15s ease;
    }

    .btn-google:hover { background: rgba(255, 255, 255, .14); border-color: rgba(255, 243, 230, .6); }
    .btn-google:disabled { opacity: .65; cursor: wait; }
    .btn-google svg { display: block; flex: 0 0 20px; background: #fff; border-radius: 50%; padding: 2px; }

    .switch-row { margin-top: 30px; text-align: center; font-size: 14.5px; color: var(--cream-dim); }

    .switch-link {
      color: #fff;
      font-weight: 700;
      text-decoration: none;
      border-bottom: 2px solid var(--saffron);
      padding-bottom: 1px;
    }

    .switch-link:hover { color: var(--saffron); }

    .form-message {
      display: none;
      font-size: 13.5px;
      line-height: 1.5;
      padding: 0 0 0 12px;
      margin: -8px 0 18px;
      border-left: 3px solid;
    }

    .form-message.show { display: block; animation: slideUp .25s ease both; }
    .form-message.error { color: #ffb4a8; border-color: #ff7a66; }
    .form-message.success { color: #a8f0cb; border-color: #4fd18f; }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(40px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }

    /* ===================== RESPONSIVE ===================== */
    @media (max-width: 1100px) {
      :root { --panel-w: 400px; }
      .hero .feats { gap: 18px; font-size: 13px; }
    }

    /* Tablet and phone: keep the form floating above the campus photo */
    @media (max-width: 860px) {
      .bg-wrap::before {
        top: 0;
        width: 100%;
        height: 100%;
        aspect-ratio: auto;
        background-position: center;
        background-size: cover;
      }

      .bg-wrap::after {
        background: linear-gradient(180deg, rgba(14, 35, 52, .26), rgba(14, 35, 52, .16));
      }

      .hero { display: none; }

      .brand {
        top: calc(18px + env(safe-area-inset-top));
        left: calc(18px + env(safe-area-inset-left));
        color: #173b59;
        text-shadow: 0 1px 9px rgba(255, 255, 255, .68);
      }
      .brand .mark { width: 44px; height: 44px; flex-basis: 44px; }
      .brand .name { font-size: 16px; }
      .brand .sub { color: #38566d; font-size: 10px; letter-spacing: .13em; }

      .panel {
        top: calc(76px + env(safe-area-inset-top));
        left: clamp(18px, 5.2vw, 28px);
        right: clamp(18px, 5.2vw, 28px);
        bottom: max(24px, env(safe-area-inset-bottom));
        width: auto;
        max-width: none;
        max-height: none;
        justify-content: space-between;
        padding: 32px 30px 26px;
        overflow-y: hidden;
        background: rgba(255, 252, 247, .94);
        border: 1px solid rgba(255, 255, 255, .84);
        border-radius: 18px;
        box-shadow: 0 18px 52px rgba(13, 35, 52, .28);
        backdrop-filter: blur(16px) saturate(115%);
        -webkit-backdrop-filter: blur(16px) saturate(115%);
        translate: none;
        animation: sheetUp .6s cubic-bezier(.2, .8, .2, 1) both;
      }

      .panel .eyebrow { color: #37627b; margin-bottom: 9px; }
      h1 { color: #193b56; font-size: 36px; }
      .tagline { margin: 8px 0 26px; color: #647586; font-size: 15.5px; }
      .field { margin-bottom: 18px; }
      .field label { color: #627487; margin-bottom: 7px; }
      .input-wrap input {
        min-height: 56px;
        padding: 11px 46px 11px 16px;
        border: 1px solid #d7dfe5;
        border-radius: 10px;
        background: rgba(255, 255, 255, .94);
        color: #243c50;
        font-size: 17px;
      }
      .input-wrap input::placeholder { color: #929da8; }
      .input-wrap input:focus { border-color: #376987; box-shadow: 0 0 0 3px rgba(55, 105, 135, .12); }
      .input-wrap input:-webkit-autofill {
        -webkit-text-fill-color: #243c50;
        -webkit-box-shadow: 0 0 0 40px #fff inset;
        caret-color: #243c50;
      }
      .toggle-eye { color: #617487; }
      .toggle-eye:hover { color: #1c5578; }
      .options-row { margin: 0 0 18px; color: #627487; }
      .checkbox-wrap { color: #627487; }
      .checkbox-wrap input { accent-color: #245b7c; }
      .forgot-link { color: #245b7c; }
      .btn-primary {
        min-height: 56px;
        border-radius: 10px;
        background: #205675;
        color: #fff8ef;
        box-shadow: 0 7px 18px rgba(32, 86, 117, .18);
      }
      .btn-primary:hover { background: #17445f; }
      .btn-primary:focus-visible, .btn-google:focus-visible { outline-color: #245b7c; }
      .btn-google {
        border-color: #d7dfe5;
        border-radius: 10px;
        background: rgba(255, 255, 255, .96);
        color: #2a4052;
      }
      .btn-google svg { background: transparent; border-radius: 0; padding: 0; }
      .btn-google:hover { background: #fff; border-color: #b8c8d4; }
      .divider { color: #718092; margin: 18px 0; }
      .divider::before, .divider::after { background: #dce3e8; }
      .switch-row { margin-top: 18px; color: #657587; }
      .switch-link { color: #213f58; border-bottom-color: #b97735; }
      .form-message.error { color: #a53d35; border-color: #cc5c4e; }
      .form-message.success { color: #28734f; border-color: #46a778; }
    }

    @media (min-width: 600px) and (max-width: 860px) {
      .panel {
        left: 50%;
        right: auto;
        width: min(580px, calc(100vw - 48px));
        translate: -50% 0;
      }
    }

    @media (max-width: 860px) and (max-height: 720px) {
      .panel {
        top: calc(66px + env(safe-area-inset-top));
        bottom: max(12px, env(safe-area-inset-bottom));
        padding: 22px 24px 18px;
      }
      h1 { font-size: 32px; }
      .tagline { margin: 5px 0 18px; font-size: 14px; }
      .field { margin-bottom: 14px; }
      .input-wrap input { min-height: 50px; padding-top: 8px; padding-bottom: 8px; font-size: 16px; }
      .options-row { margin-bottom: 14px; }
      .btn-primary { min-height: 50px; }
      .divider { margin: 14px 0; }
      .btn-google { min-height: 46px; }
      .switch-row { margin-top: 14px; }
    }

    @media (max-width: 860px) and (max-height: 640px) {
      .panel {
        top: calc(66px + env(safe-area-inset-top));
        bottom: max(8px, env(safe-area-inset-bottom));
        padding: 15px 20px 12px;
      }
      h1 { font-size: 29px; }
      .tagline { margin: 3px 0 12px; font-size: 13px; }
      .field { margin-bottom: 10px; }
      .field label { margin-bottom: 4px; font-size: 12px; }
      .input-wrap input { min-height: 46px; padding: 7px 42px 7px 12px; font-size: 15px; }
      .options-row { margin-bottom: 10px; font-size: 12px; }
      .checkbox-wrap input { width: 14px; height: 14px; }
      .btn-primary { min-height: 46px; padding: 10px; }
      .divider { margin: 10px 0; }
      .btn-google { min-height: 42px; padding: 9px 14px; }
      .switch-row { margin-top: 10px; font-size: 12px; }
    }

    @keyframes sheetUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-height: 700px) and (min-width: 861px) {
      .hero p, .hero .feats { display: none; }
    }

    @media (max-height: 480px) and (orientation: landscape) {
      .brand { display: none; }
      .panel { padding-top: 22px; }
      .tagline { margin-bottom: 14px; }
      .field { margin-bottom: 14px; }
    }
  </style>
  <script type="module" src="./guard-bootstrap.js"></script>
</head>

<body>

  <div class="bg-wrap" aria-hidden="true"></div>

  <div class="brand">
    <img class="mark" src="mgmcoet-mark.svg" alt="MGMCOET logo">
    <div>
      <div class="name">MGMCOET</div>
      <div class="sub">Unofficial Student Portal</div>
    </div>
  </div>

  <section class="hero" aria-label="Student portal introduction">
    <h2>Your campus,<br>all in one place.</h2>
    <p>Find your study resources, stay up to date, and keep your campus life connected.</p>
    <div class="feats" aria-label="Portal features">
      <span>Academics</span><span>Attendance</span><span>Community</span>
    </div>
  </section>

  <main class="panel">

    <div class="eyebrow">Welcome Back</div>
    <h1>Sign in</h1>
    <p class="tagline">Access the student portal.</p>

    <form id="loginForm">

      <div class="field">
        <label for="loginId">Roll number or email</label>
        <div class="input-wrap">
          <input type="text" id="loginId" placeholder="Roll number or approved email" autocomplete="username" required>
        </div>
      </div>

      <div class="field">
        <label for="loginPassword">Password</label>
        <div class="input-wrap">
          <input type="password" id="loginPassword" placeholder="Enter your password" autocomplete="current-password" required>
          <button type="button" class="toggle-eye" aria-label="Show password" data-toggle-password="loginPassword">
            <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-7 0-11-7-11-7a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24" />
              <path d="M1 1l22 22" />
            </svg>
          </button>
        </div>
      </div>

      <div class="options-row">
        <label class="checkbox-wrap" for="rememberDevice">
          <input type="checkbox" id="rememberDevice" checked aria-label="Remember this device">
          Remember this device
        </label>
        <a href="forgot_password.html" class="forgot-link">Forgot password?</a>
      </div>

      <div class="form-message" id="loginMessage" role="status" aria-live="polite"></div>

      <button class="btn-primary" type="submit">Sign in</button>
    </form>

    <div class="divider">or</div>

    <button class="btn-google" id="googleLoginBtn" type="button">
      <svg aria-hidden="true" viewBox="0 0 48 48" width="20" height="20"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.73 7.18l7.64 5.92c4.46-4.12 7.13-10.19 7.13-17.57z"/><path fill="#FBBC05" d="M10.53 28.59A14.4 14.4 0 0 1 9.75 24c0-1.59.27-3.13.75-4.59l-7.98-6.19A23.9 23.9 0 0 0 0 24c0 3.87.93 7.53 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.9-5.88l-7.65-5.92c-2.13 1.44-4.86 2.3-8.25 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Continue with Google
    </button>

    <div class="switch-row">
      Don't have an account?
      <a href="signup.html" class="switch-link">Create an account</a>
    </div>

  </main>

  <script type="module">
    import { signIn, redirectIfLoggedIn, getPostLoginTarget, startGoogleSignIn, handleGoogleOAuthRedirect, setRememberDevice } from './auth.js';

    window.togglePassword = function (id, el) {
      const input = document.getElementById(id);
      const isPass = input.type === 'password';
      input.type = isPass ? 'text' : 'password';
      el.classList.toggle('showing', isPass);
      el.setAttribute('aria-label', isPass ? 'Hide password' : 'Show password');
    };
    document.querySelectorAll('[data-toggle-password]').forEach((el) => {
      el.addEventListener('click', () => window.togglePassword(el.dataset.togglePassword, el));
    });
    function showMessage(el, text, type) { el.textContent = text; el.className = 'form-message show ' + type; }
    function clearMessage(el) { el.textContent = ''; el.className = 'form-message'; }

    const loginForm = document.getElementById('loginForm');
    const loginMessage = document.getElementById('loginMessage');
    const btn = loginForm.querySelector('.btn-primary');
    const googleBtn = document.getElementById('googleLoginBtn');
    const rememberDevice = document.getElementById('rememberDevice');
    googleBtn.addEventListener('click', async () => {
      googleBtn.disabled = true;
      clearMessage(loginMessage);
      try { await startGoogleSignIn(rememberDevice.checked); }
      catch (error) {
        showMessage(loginMessage, error.message || 'Google sign-in could not start.', 'error');
        googleBtn.disabled = false;
      }
    });

    (async () => {
      try {
        const handled = await handleGoogleOAuthRedirect();
        if (!handled) await redirectIfLoggedIn();
      } catch (error) {
        showMessage(loginMessage, error.message || 'Sign-in could not be completed.', 'error');
      }
    })();
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearMessage(loginMessage);
      const id = document.getElementById('loginId').value.trim();
      const password = document.getElementById('loginPassword').value;
      if (!id || !password) { showMessage(loginMessage, 'Please fill in both fields.', 'error'); return; }

      setRememberDevice(rememberDevice.checked);
      btn.disabled = true;
      showMessage(loginMessage, 'Authenticating...', 'success');
      try {
        const { user } = await signIn({ id, password });
        showMessage(loginMessage, 'Success! Redirecting to your dashboard...', 'success');
        setTimeout(() => { window.location.replace(getPostLoginTarget(user.email)); }, 600);
      } catch (err) {
        showMessage(loginMessage, err.message || 'Login failed.', 'error');
        btn.disabled = false;
      }
    });
  </script>

</body>

</html>
